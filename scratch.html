<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: #fafafa; }
  .ribbon-wrap {
    width: 80%;
    margin: 50px auto;
    position: relative;
    height: 400px;
  }
  .ribbon-l2r {
    width: 100%;
    height: 100%;
    position: relative;
  }
  /* Top-left to bottom-right S-curve */
  .r-part-1 {
    position: absolute;
    top: 0; left: 0; right: 150px; height: 50%;
    border-left: 100px solid #f97316;
    border-bottom: 100px solid #f97316;
    border-bottom-left-radius: 150px;
    box-sizing: border-box;
  }
  .r-part-2 {
    position: absolute;
    top: 50%; left: 150px; right: 0; bottom: 0;
    border-right: 100px solid #f97316;
    border-top: 100px solid #f97316;
    border-top-right-radius: 150px;
    box-sizing: border-box;
  }
</style>
</head>
<body>
  <div class="ribbon-wrap">
    <div class="ribbon-l2r">
      <div class="r-part-1"></div>
      <div class="r-part-2"></div>
    </div>
  </div>
</body>
</html>
